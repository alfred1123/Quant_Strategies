name: database

# Prod Aurora schema migrations (Liquibase) — NOT the RDS CloudFormation stack.
# Runs on EC2 via SSM: APP_ENV=prod USE_SSM=1 ./scripts/liquibase-{verify,deploy}.sh
#
# For infra (RDS CFN), use the deploy workflow → "Also deploy the database (RDS) CFN stack".

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Liquibase action against prod Aurora (via EC2 + SSM credentials)"
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
      git_ref:
        description: "Git branch, tag, or SHA to checkout on EC2 before running"
        type: string
        default: main
      confirm_deploy:
        description: 'Required when action=deploy — type exactly "deploy" to apply migrations'
        type: string
        default: ""

concurrency:
  group: database-prod
  cancel-in-progress: false

jobs:
  offline-check:
    name: offline changelog check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Validate Liquibase XML (no database)
        run: ./scripts/liquibase-verify.sh --offline

  liquibase:
    name: ${{ inputs.action }} on prod
    needs: offline-check
    runs-on: ubuntu-latest
    environment: production
    if: >-
      inputs.action == 'verify' ||
      (inputs.action == 'deploy' && inputs.confirm_deploy == 'deploy')
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Run Liquibase via SSM on EC2
        env:
          AWS_REGION: ap-southeast-1
        run: bash aws/scripts/liquibase-ssm-run.sh "${{ inputs.action }}" "${{ inputs.git_ref }}"

  deploy-blocked:
    name: deploy blocked (confirmation missing)
    needs: offline-check
    runs-on: ubuntu-latest
    if: inputs.action == 'deploy' && inputs.confirm_deploy != 'deploy'
    steps:
      - run: |
          echo "::warning::Skipped prod deploy — set confirm_deploy to \"deploy\" to apply migrations."
          echo "Use action=verify for a safe dry-run (validate + status + update-sql on EC2)."
