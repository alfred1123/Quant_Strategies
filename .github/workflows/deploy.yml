name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "tests/**"
      - "scripts/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".cursor/**"

  workflow_dispatch:
    inputs:
      deploy_database:
        description: "Also deploy the database (RDS) CFN stack — dangerous"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.flags.outputs.app }}
      nginx: ${{ steps.flags.outputs.nginx }}
      compose: ${{ steps.flags.outputs.compose }}
      db: ${{ steps.flags.outputs.db }}
      deploy: ${{ steps.flags.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            app:
              - 'quant/**'
              - 'Dockerfile'
              - 'requirements.txt'
            nginx:
              - 'frontend/**'
              - 'docker/nginx/**'
            compose:
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - 'docker-compose.tls.yml'
              - 'docker-compose.cloudflare.yml'
            db:
              - 'db/liquidbase/**'

      - name: Set deploy flags
        id: flags
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "nginx=true" >> "$GITHUB_OUTPUT"
            echo "compose=true" >> "$GITHUB_OUTPUT"
            # Migrations stay opt-in on manual dispatch — a rebuild of the images
            # should not silently apply schema changes. Use the database workflow.
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — rebuild all images and deploy"
            exit 0
          fi

          app="${{ steps.filter.outputs.app }}"
          nginx="${{ steps.filter.outputs.nginx }}"
          compose="${{ steps.filter.outputs.compose }}"
          db="${{ steps.filter.outputs.db }}"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "nginx=$nginx" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"
          echo "db=$db" >> "$GITHUB_OUTPUT"

          if [[ "$app" == "true" || "$nginx" == "true" || "$compose" == "true" || "$db" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Path filter: app=$app nginx=$nginx compose=$compose db=$db"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  frontend:
    name: frontend (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24 (matches .nvmrc and docker/nginx/Dockerfile)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests
        run: npm test

  build-and-push:
    name: build and push images
    needs: [test, frontend, changes]
    if: >-
      needs.changes.outputs.app == 'true' ||
      needs.changes.outputs.nginx == 'true' ||
      github.event_name == 'workflow_dispatch'
    # Native arm64, matching the `platforms:` below. Cross-building from x64
    # meant QEMU emulated every step of the image, and pip does not benefit:
    # it downloads prebuilt manylinux aarch64 wheels, so emulation only slowed
    # down unzipping and byte-compiling them. That one phase cost 288s of an
    # 8m build. Free and unlimited on public repos, same 4 vCPU / 16 GB.
    runs-on: ubuntu-24.04-arm
    environment: production
    env:
      AWS_REGION: ap-southeast-1
      ECR_REGISTRY: 539163478329.dkr.ecr.ap-southeast-1.amazonaws.com
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push quant-app
        if: needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/quant-app:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/quant-app:latest
          cache-from: type=gha,scope=quant-app
          cache-to: type=gha,mode=max,scope=quant-app

      - name: Build and push quant-nginx
        if: needs.changes.outputs.nginx == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/quant-nginx:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/quant-nginx:latest
          cache-from: type=gha,scope=quant-nginx
          cache-to: type=gha,mode=max,scope=quant-nginx

  cfn:
    name: deploy CloudFormation
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    # Every stack here is safe to auto-deploy on intentional infra commits:
    #   * Path filter (aws/cfn/**, aws/params/**, config/scheduler/**) means
    #     app-only pushes skip.
    #   * RDS is guarded at the AWS layer: DeletionPolicy=Retain,
    #     UpdateReplacePolicy=Snapshot, DeletionProtection=true,
    #     BackupRetentionPeriod=7. Data loss is not reachable from CFN.
    # The database stack additionally requires the DB_MASTER_PASSWORD secret
    # to avoid the script's interactive `read -rsp` prompt hanging CI.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Detect infra changes
        id: changes
        run: |
          set -euo pipefail
          force="${{ github.event_name == 'workflow_dispatch' }}"
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD~1"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${base}"
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "base=${base}"
          echo "$changed" | sed 's/^/    /'

          network=false; database=false; compute=false; ecr=false; scheduler=false
          echo "$changed" | grep -qE '^aws/cfn/00-ecr\.yml'      && ecr=true
          echo "$changed" | grep -qE '^aws/cfn/01-network\.yml'  && network=true
          echo "$changed" | grep -qE '^aws/cfn/02-database\.yml' && database=true
          echo "$changed" | grep -qE '^aws/cfn/03-compute\.yml'  && compute=true
          # The scheduler step also uploads the Lambda zip and syncs schedules,
          # so job definitions and handler code redeploy it, not just the template.
          # deploy.sh is included because it owns that packaging and sync logic —
          # the only stack for which it does more than call CloudFormation.
          echo "$changed" | grep -qE '^aws/cfn/04-scheduler\.yml'   && scheduler=true
          echo "$changed" | grep -qE '^aws/lambda/scheduled-task/'  && scheduler=true
          echo "$changed" | grep -qE '^config/scheduler/'           && scheduler=true
          echo "$changed" | grep -qE '^aws/deploy\.sh'              && scheduler=true

          if echo "$changed" | grep -q '^aws/params/prod.json'; then
            pdiff=$(git diff "$base" HEAD -- aws/params/prod.json)
            # Only +/- lines — context lines in unified diff must not trigger stacks.
            plines=$(echo "$pdiff" | grep -E '^[-+][^-+]' || true)
            echo "$plines" | grep -qE 'VpcId|SshCidr' && network=true
            echo "$plines" | grep -qE 'EngineVersion|MinACU|MaxACU|MasterUsername|SubnetIds' && database=true
            echo "$plines" | grep -qE 'InstanceType|AmiId|KeyPairName|RootVolumeSize|"ParameterKey": "SubnetId"' && compute=true
          fi

          if [[ "$force" == "true" ]]; then
            ecr=true; network=true; compute=true; scheduler=true
            [[ "${{ inputs.deploy_database }}" == "true" ]] && database=true
          fi

          echo "ecr=$ecr"         >> "$GITHUB_OUTPUT"
          echo "network=$network"   >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "compute=$compute"   >> "$GITHUB_OUTPUT"
          echo "scheduler=$scheduler" >> "$GITHUB_OUTPUT"

      - name: Deploy ECR stack
        if: steps.changes.outputs.ecr == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh ecr

      - name: Deploy network stack
        if: steps.changes.outputs.network == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh network

      - name: Deploy compute stack
        if: steps.changes.outputs.compute == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh compute

      - name: Deploy database stack
        if: steps.changes.outputs.database == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
          DB_MASTER_PASSWORD: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_MASTER_PASSWORD:-}" ]]; then
            echo "::error::DB_MASTER_PASSWORD secret is required when deploying the database stack"
            exit 1
          fi
          # Inject into params file in-place so deploy.sh picks it up via
          # its normal override-from-params flow (no script changes needed).
          python3 -c "
          import json, os
          p = 'aws/params/prod.json'
          arr = json.load(open(p))
          arr = [x for x in arr if x['ParameterKey'] != 'MasterUserPassword']
          arr.append({'ParameterKey': 'MasterUserPassword',
                      'ParameterValue': os.environ['DB_MASTER_PASSWORD']})
          json.dump(arr, open(p, 'w'))
          "
          bash aws/deploy.sh database

      # deploy.sh does three things for this stack: CFN, `aws lambda
      # update-function-code` with a zip of handler.py, then sync_schedules.py.
      # Only the last needs anything installed on the runner.
      - name: Install schedule-sync dependencies
        if: steps.changes.outputs.scheduler == 'true'
        run: pip install boto3 pyyaml

      - name: Deploy scheduler stack
        if: steps.changes.outputs.scheduler == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh scheduler

  # Schema changes wait for a human. The `production-db` environment carries a
  # required reviewer, so this job parks in "Waiting" until someone approves it,
  # while an app-only push never reaches here and deploys untouched.
  #
  # Split out of `deploy` rather than gating that job, because gating the whole
  # deploy would prompt on container-only pushes too and train the reviewer to
  # click through. Runs before `deploy` for the ordering reason below: the old
  # image must not meet the new schema.
  #
  # Pinned to github.sha, not main. Approval can sit for hours, and main may
  # have moved on by then — the migration that runs must be the one reviewed.
  migrate:
    name: migrate database
    needs: [test, changes, build-and-push, cfn]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.cfn.result == 'success' || needs.cfn.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    environment: production-db
    env:
      AWS_REGION: ap-southeast-1
      # Only changesets tagged prod-deploy. One carrying just its schema context
      # stays staged for the manually gated database workflow.
      LIQUIBASE_CONTEXTS: prod-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Apply pending changesets on EC2
        run: bash aws/scripts/liquibase-ssm-run.sh deploy "${{ github.sha }}"

  deploy:
    name: deploy to EC2
    needs: [test, changes, build-and-push, cfn, migrate]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (needs.cfn.result == 'success' || needs.cfn.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') &&
      (needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ap-southeast-1
      ECR_REGISTRY: 539163478329.dkr.ecr.ap-southeast-1.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}
      DEPLOY_APP: ${{ needs.changes.outputs.app == 'true' || github.event_name == 'workflow_dispatch' }}
      DEPLOY_NGINX: ${{ needs.changes.outputs.nginx == 'true' || github.event_name == 'workflow_dispatch' }}
      DEPLOY_COMPOSE: ${{ needs.changes.outputs.compose == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Deploy via SSM Run Command
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      # Containers restart only after the `migrate` job has finished. The reverse
      # order would leave the old image talking to the new schema — 1.4.0 drops
      # superseded procedure overloads, so the running app would lose calls it
      # still makes. That ordering is held by `needs: migrate` above, not by
      # sequencing inside this script.
      - name: Run deploy script on EC2
        run: |
          set -euo pipefail

          # Resolve from CFN output so instance replacement does not require
          # manually updating GitHub vars. vars.EC2_INSTANCE_ID is fallback only.
          INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name quant-compute \
            --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" \
            --output text)
          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"
          fi
          if [[ -z "$INSTANCE_ID" ]]; then
            echo "::error::No EC2 instance id (quant-compute stack output or EC2_INSTANCE_ID var)"
            exit 1
          fi
          echo "Deploy target instance: $INSTANCE_ID"
          echo "Flags: DEPLOY_APP=${{ env.DEPLOY_APP }} DEPLOY_NGINX=${{ env.DEPLOY_NGINX }} DEPLOY_COMPOSE=${{ env.DEPLOY_COMPOSE }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters commands='[
              "set -euo pipefail",
              "mkdir -p /opt/quant",
              "if [ ! -d /opt/quant/.git ]; then git clone https://github.com/alfred1123/Quant_Strategies.git /opt/quant; fi",
              "cd /opt/quant",
              "git config --system --add safe.directory /opt/quant",
              "echo \"── BEFORE ──\"",
              "git rev-parse --short HEAD || true",
              "git fetch --prune origin main",
              "git reset --hard origin/main",
              "echo \"── AFTER  ──\"",
              "git rev-parse --short HEAD",
              "DEPLOY_APP=${{ env.DEPLOY_APP }}",
              "DEPLOY_NGINX=${{ env.DEPLOY_NGINX }}",
              "DEPLOY_COMPOSE=${{ env.DEPLOY_COMPOSE }}",
              "ECR_REGISTRY=539163478329.dkr.ecr.ap-southeast-1.amazonaws.com",
              "IMAGE_TAG=${{ github.sha }}",
              "COMPOSE=\"docker compose -f docker-compose.yml -f docker-compose.prod.yml\"",
              "DOMAIN=\"${{ vars.DOMAIN }}\"",
              "export DOMAIN",
              "if [ -n \"$DOMAIN\" ]; then",
              "  echo \"── TLS ── fetching Cloudflare origin cert for $DOMAIN\"",
              "  mkdir -p /opt/quant/secrets",
              "  if aws ssm get-parameter --name /quant/prod/ORIGIN_TLS_CERT --with-decryption --region ap-southeast-1 --query Parameter.Value --output text > /opt/quant/secrets/origin.pem 2>/dev/null && aws ssm get-parameter --name /quant/prod/ORIGIN_TLS_KEY --with-decryption --region ap-southeast-1 --query Parameter.Value --output text > /opt/quant/secrets/origin-key.pem 2>/dev/null && [ -s /opt/quant/secrets/origin.pem ] && [ -s /opt/quant/secrets/origin-key.pem ]; then",
              "    chmod 600 /opt/quant/secrets/origin-key.pem",
              "    chmod 644 /opt/quant/secrets/origin.pem",
              "    COMPOSE=\"$COMPOSE -f docker-compose.cloudflare.yml\"",
              "    echo \"TLS overlay enabled (Cloudflare origin cert)\"",
              "  else",
              "    echo \"::warning::DOMAIN set but origin cert/key missing in SSM — staying HTTP-only\"",
              "    rm -f /opt/quant/secrets/origin.pem /opt/quant/secrets/origin-key.pem",
              "  fi",
              "else",
              "  echo \"DOMAIN not set — HTTP-only deploy\"",
              "fi",
              "ecr_digest() { aws ecr describe-images --repository-name \"$1\" --image-ids imageTag=\"$2\" --region ap-southeast-1 --query imageDetails[0].imageDigest --output text 2>/dev/null || true; }",
              "local_digest() { docker image inspect --format=\"{{index .RepoDigests 0}}\" \"$1\" 2>/dev/null | sed \"s/.*@//\" || true; }",
              "image_unchanged() { repo=\"$1\"; tag=\"$2\"; img=\"${ECR_REGISTRY}/${repo}:${tag}\"; remote=\"$(ecr_digest \"$repo\" \"$tag\")\"; local=\"$(local_digest \"$img\")\"; [ -n \"$remote\" ] && [ \"$remote\" != \"None\" ] && [ \"$remote\" = \"$local\" ]; }",
              "aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin \"$ECR_REGISTRY\"",
              "echo \"── DISK ──\"",
              "df -h / || true",
              "docker system df 2>/dev/null || true",
              "docker builder prune -af 2>/dev/null || true",
              "docker image prune -af 2>/dev/null || true",
              "ecr_tag_exists() { aws ecr describe-images --repository-name \"$1\" --image-ids imageTag=\"$2\" --region ap-southeast-1 >/dev/null 2>&1; }",
              "resolve_app_tag() { if ecr_tag_exists quant-app \"$IMAGE_TAG\"; then echo \"$IMAGE_TAG\"; elif ecr_tag_exists quant-app latest; then echo latest; else echo \"::error::No quant-app image for ${IMAGE_TAG} or latest\" >&2; exit 1; fi; }",
              "resolve_nginx_tag() { if ecr_tag_exists quant-nginx \"$IMAGE_TAG\"; then echo \"$IMAGE_TAG\"; elif ecr_tag_exists quant-nginx latest; then echo latest; else echo \"::error::No quant-nginx image for ${IMAGE_TAG} or latest\" >&2; exit 1; fi; }",
              "APP_TAG=$(resolve_app_tag)",
              "NGINX_TAG=$(resolve_nginx_tag)",
              "export APP_IMAGE=\"${ECR_REGISTRY}/quant-app:${APP_TAG}\"",
              "export NGINX_IMAGE=\"${ECR_REGISTRY}/quant-nginx:${NGINX_TAG}\"",
              "echo \"APP_IMAGE=$APP_IMAGE\"",
              "echo \"NGINX_IMAGE=$NGINX_IMAGE\"",
              "if [ \"$DEPLOY_APP\" = \"true\" ]; then",
              "  echo \"── APP ──\"",
              "  if image_unchanged quant-app \"$APP_TAG\"; then",
              "    echo \"App image digest unchanged — skip pull\"",
              "  else",
              "    COMPOSE_PARALLEL_LIMIT=1 $COMPOSE pull api worker",
              "  fi",
              "  $COMPOSE up -d --no-build api worker",
              "else",
              "  echo \"Skip app pull/up — no quant-app changes in this push\"",
              "fi",
              "if [ \"$DEPLOY_NGINX\" = \"true\" ]; then",
              "  echo \"── NGINX ──\"",
              "  if image_unchanged quant-nginx \"$NGINX_TAG\"; then",
              "    echo \"Nginx image digest unchanged — skip pull\"",
              "  else",
              "    COMPOSE_PARALLEL_LIMIT=1 $COMPOSE pull nginx",
              "  fi",
              "  $COMPOSE up -d --no-build nginx",
              "else",
              "  echo \"Skip nginx pull/up — no quant-nginx changes in this push\"",
              "fi",
              "if [ \"$DEPLOY_COMPOSE\" = \"true\" ]; then",
              "  echo \"── COMPOSE ── apply updated compose files\"",
              "  $COMPOSE up -d --no-build --remove-orphans",
              "fi",
              "docker image prune -f",
              "echo \"── RUNNING ──\"",
              "$COMPOSE ps"
            ]' \
            --query Command.CommandId \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Poll for up to ~15 min — a first-time Liquibase install on the box
          # downloads a JRE before any migration runs. Distinguish three outcomes:
          #   * aws CLI error            → print stderr, retry (don't mask)
          #   * Status in (Pending, InProgress, Delayed) → keep waiting
          #   * Status == Success                       → exit 0
          #   * Status in (Failed, TimedOut, Cancelled) → exit 1
          #
          # The previous version did `... 2>/dev/null || echo "Pending"`,
          # which silently swallowed real CLI errors and caused the loop
          # to print "Pending" forever — even after EC2 had finished
          # successfully. Surfacing stderr is critical for diagnosis.
          MAX_ATTEMPTS=90
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            sleep 10
            INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>&1) || {
              # InvocationDoesNotExist is normal for the first ~15s — keep
              # waiting. Anything else, surface and keep retrying so a
              # transient blip doesn't fail the deploy.
              if echo "$INVOCATION" | grep -q "InvocationDoesNotExist"; then
                echo "Attempt $i: invocation not yet visible to SSM"
              else
                echo "Attempt $i: aws CLI error (will retry):"
                echo "$INVOCATION" | sed 's/^/    /'
              fi
              continue
            }

            STATUS=$(echo "$INVOCATION" | jq -r .Status)
            echo "Attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "── Deploy succeeded ──"
                echo "$INVOCATION" | jq -r .StandardOutputContent | tail -50
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "── Deploy failed: $STATUS ──"
                echo "stdout:"
                echo "$INVOCATION" | jq -r .StandardOutputContent | tail -50
                echo "stderr:"
                echo "$INVOCATION" | jq -r .StandardErrorContent | tail -50
                exit 1
                ;;
            esac
          done

          echo "Timed out after $MAX_ATTEMPTS polls — deploy may still be running on EC2"
          exit 1

      - uses: actions/checkout@v4

      - name: Verify HTTPS (Cloudflare)
        if: vars.DOMAIN != ''
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          AWS_REGION: ap-southeast-1
        run: bash aws/scripts/verify-https.sh

  # A red deploy is only as loud as whoever happens to look at it. The
  # log-proc-summary migration failed on 2026-08-04 and stayed broken for three
  # days because the next push touched no db/liquibase files, so it skipped the
  # migration and went green — the success hid the still-pending changeset.
  #
  # An issue is used rather than a webhook because it needs no secret and, unlike
  # an email, it stays open until someone closes it.
  report-failure:
    name: report deploy failure
    needs: [test, frontend, changes, build-and-push, cfn, migrate, deploy]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed deploy
        uses: actions/github-script@v7
        with:
          script: |
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);

            const sha = context.sha.slice(0, 8);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed on ${sha}`,
              labels: ['deploy-failure'],
              body: [
                `Deploy of \`${sha}\` failed in **${failed.join('`, `')}**.`,
                ``,
                `[Run log](${url})`,
                ``,
                `Prod may be mid-way. \`migrate\` runs before \`deploy\`, so a`,
                `failure in \`deploy\` can leave the new schema under the old`,
                `image. A failure in \`migrate\` stops the rollout before any`,
                `container restarts. Check which job failed before re-running.`,
              ].join('\n'),
            });
