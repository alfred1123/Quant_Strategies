name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "tests/**"
      - ".github/skills/**"
      - ".github/instructions/**"
      - ".cursor/**"

  workflow_dispatch:
    inputs:
      deploy_database:
        description: "Also deploy the database (RDS) CFN stack — dangerous"
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  build:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  cfn:
    name: deploy CloudFormation
    needs: [test]
    runs-on: ubuntu-latest
    environment: production
    # All three stacks are safe to auto-deploy on intentional infra commits:
    #   * Path filter (aws/cfn/** or aws/params/**) means app-only pushes skip.
    #   * RDS is guarded at the AWS layer: DeletionPolicy=Retain,
    #     UpdateReplacePolicy=Snapshot, DeletionProtection=true,
    #     BackupRetentionPeriod=7. Data loss is not reachable from CFN.
    # The database stack additionally requires the DB_MASTER_PASSWORD secret
    # to avoid the script's interactive `read -rsp` prompt hanging CI.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Detect infra changes
        id: changes
        run: |
          set -euo pipefail
          force="${{ github.event_name == 'workflow_dispatch' }}"
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            base="HEAD~1"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${base}"
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "base=${base}"
          echo "$changed" | sed 's/^/    /'

          network=false; database=false; compute=false; ecr=false
          echo "$changed" | grep -qE '^aws/cfn/00-ecr\.yml'      && ecr=true
          echo "$changed" | grep -qE '^aws/cfn/01-network\.yml'  && network=true
          echo "$changed" | grep -qE '^aws/cfn/02-database\.yml' && database=true
          echo "$changed" | grep -qE '^aws/cfn/03-compute\.yml'  && compute=true

          if echo "$changed" | grep -q '^aws/params/prod.json'; then
            pdiff=$(git diff "$base" HEAD -- aws/params/prod.json)
            # Only +/- lines — context lines in unified diff must not trigger stacks.
            plines=$(echo "$pdiff" | grep -E '^[-+][^-+]' || true)
            echo "$plines" | grep -qE 'VpcId|SshCidr' && network=true
            echo "$plines" | grep -qE 'EngineVersion|MinACU|MaxACU|MasterUsername|SubnetIds' && database=true
            echo "$plines" | grep -qE 'InstanceType|AmiId|KeyPairName|"ParameterKey": "SubnetId"' && compute=true
          fi

          if [[ "$force" == "true" ]]; then
            ecr=true; network=true; compute=true
            [[ "${{ inputs.deploy_database }}" == "true" ]] && database=true
          fi

          echo "ecr=$ecr"         >> "$GITHUB_OUTPUT"
          echo "network=$network"   >> "$GITHUB_OUTPUT"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "compute=$compute"   >> "$GITHUB_OUTPUT"

      - name: Deploy ECR stack
        if: steps.changes.outputs.ecr == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh ecr

      - name: Deploy network stack
        if: steps.changes.outputs.network == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh network

      - name: Deploy compute stack
        if: steps.changes.outputs.compute == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
        run: bash aws/deploy.sh compute

      - name: Deploy database stack
        if: steps.changes.outputs.database == 'true'
        env:
          APP_ENV: prod
          AWS_REGION: ap-southeast-1
          DB_MASTER_PASSWORD: ${{ secrets.DB_MASTER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${DB_MASTER_PASSWORD:-}" ]]; then
            echo "::error::DB_MASTER_PASSWORD secret is required when deploying the database stack"
            exit 1
          fi
          # Inject into params file in-place so deploy.sh picks it up via
          # its normal override-from-params flow (no script changes needed).
          python3 -c "
          import json, os
          p = 'aws/params/prod.json'
          arr = json.load(open(p))
          arr = [x for x in arr if x['ParameterKey'] != 'MasterUserPassword']
          arr.append({'ParameterKey': 'MasterUserPassword',
                      'ParameterValue': os.environ['DB_MASTER_PASSWORD']})
          json.dump(arr, open(p, 'w'))
          "
          bash aws/deploy.sh database

  deploy:
    name: deploy to EC2
    needs: [test, build, cfn]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSM Run Command
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Run deploy script on EC2
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ vars.EC2_INSTANCE_ID }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 900 \
            --parameters commands='[
              "set -euo pipefail",
              "cd /opt/quant",
              "git config --system --add safe.directory /opt/quant",
              "echo \"── BEFORE ──\"",
              "git rev-parse --short HEAD || true",
              "git fetch --prune origin main",
              "git reset --hard origin/main",
              "echo \"── AFTER  ──\"",
              "git rev-parse --short HEAD",
              "COMPOSE_PARALLEL_LIMIT=1 DOCKER_BUILDKIT=1 docker compose -f docker-compose.yml -f docker-compose.prod.yml build --pull",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans",
              "docker image prune -f",
              "echo \"── RUNNING ──\"",
              "docker compose -f docker-compose.yml -f docker-compose.prod.yml ps"
            ]' \
            --query Command.CommandId \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # Poll for up to ~10 min. Distinguish three outcomes:
          #   * aws CLI error            → print stderr, retry (don't mask)
          #   * Status in (Pending, InProgress, Delayed) → keep waiting
          #   * Status == Success                       → exit 0
          #   * Status in (Failed, TimedOut, Cancelled) → exit 1
          #
          # The previous version did `... 2>/dev/null || echo "Pending"`,
          # which silently swallowed real CLI errors and caused the loop
          # to print "Pending" forever — even after EC2 had finished
          # successfully. Surfacing stderr is critical for diagnosis.
          MAX_ATTEMPTS=60
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            sleep 10
            INVOCATION=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>&1) || {
              # InvocationDoesNotExist is normal for the first ~15s — keep
              # waiting. Anything else, surface and keep retrying so a
              # transient blip doesn't fail the deploy.
              if echo "$INVOCATION" | grep -q "InvocationDoesNotExist"; then
                echo "Attempt $i: invocation not yet visible to SSM"
              else
                echo "Attempt $i: aws CLI error (will retry):"
                echo "$INVOCATION" | sed 's/^/    /'
              fi
              continue
            }

            STATUS=$(echo "$INVOCATION" | jq -r .Status)
            echo "Attempt $i: $STATUS"

            case "$STATUS" in
              Success)
                echo "── Deploy succeeded ──"
                echo "$INVOCATION" | jq -r .StandardOutputContent | tail -50
                exit 0
                ;;
              Failed|TimedOut|Cancelled)
                echo "── Deploy failed: $STATUS ──"
                echo "stdout:"
                echo "$INVOCATION" | jq -r .StandardOutputContent | tail -50
                echo "stderr:"
                echo "$INVOCATION" | jq -r .StandardErrorContent | tail -50
                exit 1
                ;;
            esac
          done

          echo "Timed out after $MAX_ATTEMPTS polls — deploy may still be running on EC2"
          exit 1
