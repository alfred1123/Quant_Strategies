name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/mermaid-check/**"
      - ".github/workflows/docs.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  # A malformed diagram does not fail `mkdocs build` — it publishes as raw text,
  # because mermaid only parses it in the browser. So parse them here instead.
  mermaid:
    name: mermaid syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/mermaid-check/package-lock.json

      - name: Install the mermaid parser
        run: npm ci
        working-directory: scripts/mermaid-check

      - name: Parse every diagram in docs/
        run: node scripts/mermaid-check/check.mjs docs

  deploy:
    name: deploy docs
    runs-on: ubuntu-latest
    # Gate the publish: a broken diagram should not reach the wiki.
    needs: mermaid
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      # Broken links and anchors fail the build instead of publishing rot.
      # The tree was brought to zero warnings on 2026-08-29; keep it there.
      - name: Verify links and anchors
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
