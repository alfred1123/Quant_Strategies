name: tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v

  liquibase:
    name: liquibase (offline validate)
    runs-on: ubuntu-latest
    env:
      # Keeps the install non-root; the deploy host uses /opt/liquibase.
      LIQUIBASE_HOME: ${{ github.workspace }}/.liquibase
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Liquibase
        run: |
          bash aws/scripts/install-liquibase.sh
          echo "$LIQUIBASE_HOME" >> "$GITHUB_PATH"

      # Parses the changelog tree and renders the SQL that deploy.yml would apply,
      # with no database attached — so a bad changeset fails here rather than
      # half-way through a migration on the EC2 host.
      - name: Validate changelogs and render the prod-deploy slice
        run: ./scripts/liquibase-verify.sh --offline

  frontend:
    name: frontend (build + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24 (matches .nvmrc and docker/nginx/Dockerfile)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Neither the build nor the tests catch a lint error: a cascading-render
      # effect type-checks and passes its tests while still being wrong.
      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Run unit tests
        run: npm test
