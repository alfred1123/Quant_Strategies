# Production override — SSM secrets, prod flags, ECR image URIs.
#
# Local / build-on-EC2 (until ECR step 3 cutover):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# ECR pull deploy (step 3+) — set on EC2 before pull/up:
#   export IMAGE_TAG=<git-sha>
#   export APP_IMAGE=539163478329.dkr.ecr.ap-southeast-1.amazonaws.com/quant-app:${IMAGE_TAG}
#   export NGINX_IMAGE=539163478329.dkr.ecr.ap-southeast-1.amazonaws.com/quant-nginx:${IMAGE_TAG}
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
#
# To add TLS later, layer docker-compose.tls.yml on top:
#   export DOMAIN=yourdomain.com
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tls.yml up -d

services:
  api:
    image: ${APP_IMAGE:-quant-app:latest}
    environment:
      - APP_ENV=prod
      - USE_SSM=1
      - COOKIE_SECURE=0
  worker:
    image: ${APP_IMAGE:-quant-app:latest}
    # Two children saturate the host's two cores; a third would only time-slice
    # them while stealing one from the api at apply time. Raising this needs
    # 4 vCPU, not more RAM — see docs/archive/infra-capacity-review.md §3.2.
    # Safe at >1 because one loop claims sequentially; the non-atomic claim
    # only races across separate worker_loop replicas (backtest-queue.md §0).
    environment:
      - APP_ENV=prod
      - USE_SSM=1
      - MAX_CONCURRENT_WORKERS=2
    # Unbounded, a runaway grid search is a host-wide event: with no swap the
    # OOM killer scores quant-api as readily as the job that caused it.
    # This bounds the whole container -- loop plus BOTH children -- so the
    # budget is 2 x 590 MiB peak + ~72 MiB loop = ~1.25 GiB measured worst
    # case, and 2g leaves ~750 MiB of slack. Raise it with the worker count,
    # or a third child would OOM at its peak rather than get a slot.
    mem_limit: 2g
    cpu_shares: 512
  nginx:
    image: ${NGINX_IMAGE:-quant-nginx:latest}
