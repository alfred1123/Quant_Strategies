services:
  redis:
    # Cache layer for REFDATA snapshots published by FastAPI on boot, plus
    # the queue wake channel (BLPOP bt:queue:wake) used by the worker. In-
    # memory only — no AOF, no RDB — because Postgres is the source of truth
    # and FastAPI rehydrates on boot. See docs/decisions.md (REFDATA caching).
    image: redis:7-alpine
    container_name: quant-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Backtest queue worker (Python). Long-lived `quant.queue.worker_loop`
  # daemon that claims QUEUED rows from BT.QUEUE, spawns one
  # `python -m quant.queue.worker <queue_id>` subprocess per job, and
  # writes terminal state. Reuses the FastAPI image (`Dockerfile`).
  #
  # Boots AFTER api is healthy because `recover_stale` calls
  # `RedisRefData.resolve_queue_status_id("RUNNING")` immediately, and
  # FastAPI's lifespan is what publishes REFDATA into Redis. /health/ready
  # only returns 200 once lifespan completes.
  #
  # See docs/design/backtest-queue.md.
  worker:
    image: quant-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-worker
    restart: unless-stopped
    command: ["python", "-m", "quant.queue.worker_loop"]
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - USE_SSM=${USE_SSM:-1}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-1}
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  api:
    image: quant-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-api
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-dev}
      # Nginx image serves HTTP on :80 unless TLS overlay is used. Without this, a
      # .env of APP_ENV=prod yields Secure cookies the browser will not store.
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - USE_SSM=${USE_SSM:-1}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    env_file:
      - path: .env
        required: false
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: quant-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  # ── Production TLS (activate with --profile prod) ──────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: quant-certbot
    profiles: [prod]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  certbot-conf:
  certbot-www:
