# Local-DB dev support stack — Redis + queue worker.
#
# This compose file is *only* used when DB_TARGET=local (see scripts/appctl.sh).
# It is intentionally separate from docker-compose.yml so the rest of the dev
# loop (uvicorn + vite running natively on the host) is unaffected for
# teammates who keep DB_TARGET=prod and reach Aurora via the SSM tunnel.
#
# What runs here:
#   * redis  — REFDATA cache (FastAPI publishes on boot) + queue wake channel
#              (BLPOP bt:queue:wake). Mapped to host :6379 so the host-side
#              uvicorn (quant/api/main.py) and worker container can both reach it.
#   * worker — Long-lived ``python -m quant.queue.worker_loop`` daemon. Uses
#              host networking so it can reach both local Postgres
#              (127.0.0.1:5432) and Redis (127.0.0.1:6379) without an extra
#              docker network. REFDATA must be published by FastAPI first —
#              ``appctl.sh dev start`` boots uvicorn before the worker.
#
# Bring up:
#     docker compose -f docker-compose.dev.yml up -d
# Logs:
#     docker compose -f docker-compose.dev.yml logs -f worker
# Tear down:
#     docker compose -f docker-compose.dev.yml down

services:
  redis:
    image: redis:7-alpine
    container_name: quant-dev-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-dev-worker
    restart: unless-stopped
    command: ["python", "-m", "quant.queue.worker_loop"]
    # host networking so the container can reach the local Postgres on
    # 127.0.0.1:5432 (installed natively, not in compose) AND Redis on
    # 127.0.0.1:6379 (mapped above).  Linux/WSL2 only — fine for dev.
    network_mode: host
    environment:
      - REDIS_URL=redis://127.0.0.1:6379
      - USE_SSM=0
      - QUANTDB_HOST=${LOCAL_DB_HOST:-127.0.0.1}
      - QUANTDB_PORT=${LOCAL_DB_PORT:-5432}
      - QUANTDB_USERNAME=${LOCAL_DB_USER:-quant_admin}
      - QUANTDB_PASSWORD=${LOCAL_DB_PASSWORD:-LetsGetRich888}
      - QUANTDB_DATABASE=${LOCAL_DB_NAME:-quantdb}
      - QUANTDB_SSLMODE=disable
      - MAX_CONCURRENT_WORKERS=${MAX_CONCURRENT_WORKERS:-1}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
